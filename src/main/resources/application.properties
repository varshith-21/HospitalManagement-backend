spring.application.name=backend
server.port=${PORT:8080}

# Embedded H2 Database by default (zero setup needed)
# If DB_URL is provided, it will automatically switch to your custom database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

